name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci            # postinstall seeds assets/data/*.json from the committed samples
      # expo-env.d.ts is generated by `expo start` and gitignored by Expo's convention;
      # tsc needs it for the CSS-module and side-effect-import types.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npx jest --ci
